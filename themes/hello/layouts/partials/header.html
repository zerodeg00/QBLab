<header class="site-header">
  <div class="header-inner">
    <a href="{{ .Site.BaseURL }}" class="site-logo">
      <img src="{{ "logo.png" | relURL }}" alt="{{ .Site.Title }}" class="logo-img">
      <span class="logo-text-wrap">
        <span class="logo-text">큐비랩</span>
        <span class="logo-sub">비트노마드의 투자일지</span>
      </span>
    </a>
  </div>
  <nav class="site-nav">
    <span class="header-compact-brand" aria-hidden="true">
      <img src="{{ "logo.png" | relURL }}" alt="" class="header-compact-logo">
      <span class="header-compact-subtitle">비트노마드의 투자일지</span>
    </span>
    <div class="site-nav-links">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </div>
  </nav>
</header>
