baseURL = 'https://qblab.kr/'
languageCode = 'ko'
title = '큐비랩 — 비트노마드의 투자일지'
theme = 'hello'
paginate = 12
[services]
  [services.googleAnalytics]
    ID = 'G-TNCCE8KVLR'

[params]
  author = '큐비랩'
  description = '비트코인 자동매매 시스템을 직접 개발하고 운용하는 비트노마드의 투자일지. 매일 시장 분석과 실전 트레이딩 기록을 공유합니다.'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = false
  defaultTheme = 'auto'
  DateFormat = '2006-01-02'
  kakaoJsKey = '49818f3b6047e6d3f00605a784c70a12'

  [params.homeInfoParams]
    Title = '기록으로 만들어가는 경제적 자유'
    Content = '비트코인 자동매매 시스템을 직접 개발하고 운용하는 비트노마드의 투자일지. 매일 시장 분석과 실전 트레이딩 기록을 공유합니다.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/zerodeg00'

[params.sidebar]
  avatar = '/images/profile.png'
  nickname = '비트노마드'
  bio = '비트코인 자동매매로 경제적 자유를 이루고 싶은 비트노마드입니다.'

[params.cover]
  hidden = false
  hiddenInList = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

