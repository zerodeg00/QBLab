baseURL = 'https://qblab.kr/'
languageCode = 'ko'
title = '큐비랩 — 자동매매 시스템의 시장 분석'
theme = 'hello'
paginate = 12

[params]
  author = '큐비랩'
  description = '자동매매 시스템을 직접 개발하고 운용하며, 비트코인 시장 분석과 트레이딩 인사이트를 공유합니다.'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = false
  defaultTheme = 'auto'
  DateFormat = '2006-01-02'

  [params.homeInfoParams]
    Title = '기록으로 만들어가는 경제적 자유'
    Content = '자동매매 시스템을 직접 개발하고 운용하며, 비트코인 시장 분석과 트레이딩 인사이트를 공유합니다.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/zerodeg00'

[params.cover]
  hidden = false
  hiddenInList = false

[outputs]
  home = ['HTML', 'RSS']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
  name = '홈'
  url = '/'
  weight = 1

[[menus.main]]
  name = '데일리 브리핑'
  url = '/posts/'
  weight = 2

[[menus.main]]
  name = '매매내역'
  url = '/trades/'
  weight = 3

[[menus.main]]
  name = '소개'
  url = '/about/'
  weight = 4

[[menus.main]]
  name = '태그'
  url = '/tags/'
  weight = 5

[params.assets]
  favicon = '/favicon.ico'

[params.footer]
  copyright = '© 2026 큐비랩. All rights reserved.'
